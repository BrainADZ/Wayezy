# WAY EZY + MongoDB. Copy .env.example to .env, set production mode and secrets, then: docker compose up -d --build
# Terminate TLS in front of this (reverse proxy / load balancer) and set PUBLIC_BASE_URL to the https URL.
services:
  db:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?Set MONGO_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    volumes:
      - mongodata:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand({ping:1}).ok"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4173
      DATA_DIR: /app/.data
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@db:27017/?authSource=admin
      MONGODB_DATABASE: ${MONGODB_DATABASE:-wayezy}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      - '${HOST_PORT:-4173}:4173'
    volumes:
      # Uploaded media (local storage driver) and generated secrets.
      - appdata:/app/.data
    depends_on:
      db:
        condition: service_healthy

volumes:
  mongodata:
  appdata:
